# Owner site, for the local network only: serves the admin web app and forwards the full API to the server.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx's default table has no .mjs, and browsers refuse module scripts that are not served as JavaScript.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }
    # The server accepts uploads up to 15 MB.
    client_max_body_size 20m;

    gzip on;
    gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml;

    location ~ ^/(api|images|admin)/ {
        set $upstream http://server:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_request_buffering off;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
