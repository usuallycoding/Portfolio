# Public site: serves the client web app and forwards only the public read API to the server.
# Docker's DNS is looked up per request, so this container can start before (or outlive) the server.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx's default table has no .mjs, and browsers refuse module scripts that are not served as JavaScript.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    gzip on;
    gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Owner endpoints are never reachable from the public site.
    location /admin {
        return 404;
    }

    location /api/ {
        set $upstream http://server:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    location /images/ {
        set $upstream http://server:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    # Revalidate on every load (ETag keeps it cheap) so a new release is picked up immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
