product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - //core
  - //app/sharedData
  - //app/sharedUi
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $libs.compose.material.icons.extended
  - $compose.ui
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.ktor.client.core
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel
  - $libs.compose.backhandler

dependencies@android:
  - $compose.uiTooling

settings:
  compose: enabled

test-dependencies:
  - $kotlin.test
  - $libs.ktor.client.mock
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json
  - $libs.kotlinx.coroutines.test
  - $compose.desktop.currentOs
  - $libs.compose.ui.test
